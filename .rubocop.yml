plugins:
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-capybara
  - rubocop-factory_bot
  - standard-custom
  - standard-performance
  - standard-rails
  - standard-rspec

inherit_gem:
  standard: config/base.yml

# standard-rspec only overrides part of the rspec, rspec_rails, capybara and factory_bot configs, so their
# defaults are loaded first as plugins. Cops the defaults mark pending stay off, like under the standardrb CLI.
AllCops:
  NewCops: disable

# System specs walk through whole user flows, which rarely fit in five lines.
RSpec/ExampleLength:
  Exclude:
    - "spec/system/**/*"
